name: Daily Sprintkiller Bot

on:
  schedule:
    # Runs every day at 07:00 UTC (08:00 WAT)
    - cron: '0 7 * * *'
  workflow_dispatch:   # Allows you to run it manually anytime

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests curl_cffi

      - name: Execute Daily Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional proxy if you need it later
          # HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
        run: python main.py

      - name: Commit and Push Daily Data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update daily model board data $(date +%Y-%m-%d)"
          git push
